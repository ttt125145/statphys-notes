name: Deploy Quartz Site to Pages

on:
  push:
    branches: ["v4"]
  workflow_dispatch:

# 添加这行环境变量配置
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 设置 GitHub Pages 部署的权限
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      # ... 其他步骤保持不变