name: Deploy Quartz Site to Pages

on:
  # 设置为在您的主分支有推送时触发（请将 `v4` 替换为您实际使用的分支名）
  push:
    branches: ["V4"]
  # 允许在 GitHub 网页界面手动触发此工作流
  workflow_dispatch:

# 设置 GitHub Pages 部署的权限
permissions:
  contents: write
  pages: write
  id-token: write

# 部署任务
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取所有历史用于生成链接等

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 上传 Quartz 构建生成的 `public` 目录
          path: './public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4